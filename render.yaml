databases:
  - name: divaj-db
    plan: free
    databaseName: divaj
    user: divaj

services:
  - type: web
    name: divaj
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: divaj-db
          property: connectionString
